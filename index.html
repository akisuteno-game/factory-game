<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>
<style>
body{margin:0;font-family:sans-serif;background:#1a1a18;color:#eee}
#ui{padding:8px;display:flex;gap:8px}
button{padding:10px;border-radius:8px;border:none;background:#333;color:#fff}
canvas{display:block;margin:auto;background:#222;touch-action:none}
.active{background:#5a5}
</style>
</head>
<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">採掘</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">コンベア</button>
  <button onclick="selectTool('delete')" id="btn-delete">削除</button>
</div>

<canvas id="c"></canvas>

<script>
const CELL=50, COLS=12, ROWS=8;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

canvas.width=COLS*CELL;
canvas.height=ROWS*CELL;

let selected='miner';

const grid={};
const machines=[];

const G={mat:0};

// 👇 アイコン定義（ここ変えれば拡張できる）
const RES_TYPES={
  iron:{color:"#cccccc"},
  copper:{color:"#ff8844"}
};

const resourceNodes=[
  {x:2,y:3,type:"iron"},
  {x:7,y:5,type:"copper"}
];

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+t)?.classList.add("active");
}

function place(x,y){
  if(get(x,y)) return;
  const node=resourceNodes.find(n=>n.x===x&&n.y===y);

  const m={
    id:selected,
    x,y,
    dir:0,
    buf:0,
    type: node?.type || "iron",
    cool:0
  };

  machines.push(m);
  grid[key(x,y)]=m;
}

function remove(x,y){
  const k=key(x,y);
  const m=grid[k];
  if(!m) return;
  delete grid[k];
  const i=machines.indexOf(m);
  if(i!==-1) machines.splice(i,1);
}

function rotate(m){m.dir=(m.dir+1)%4}

function handleInput(e){
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL);
  const y=Math.floor((e.clientY-r.top)/CELL);
  const m=get(x,y);

  if(selected==='delete'){
    remove(x,y);
    save();
    return;
  }

  if(m && m.id==='conveyor'){
    rotate(m);
  }else{
    place(x,y);
  }

  save();
}

canvas.addEventListener("click", handleInput);
canvas.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  handleInput(e.touches[0]);
});

function update(){
  machines.forEach(m=>{
    if(m.cool>0) m.cool--;

    if(m.id==='miner'){
      if(Math.random()<0.02){
        m.buf++;
      }

      if(m.buf>0 && m.cool===0){
        const dir=[[1,0],[0,1],[-1,0],[0,-1]][m.dir];
        const next=get(m.x+dir[0],m.y+dir[1]);

        if(next){
          next.buf++;
          next.type=m.type;
          m.buf--;
          m.cool=20;
        }
      }
    }

    if(m.id==='conveyor'){
      if(m.buf>0 && m.cool===0){
        const dir=[[1,0],[0,1],[-1,0],[0,-1]][m.dir];
        const next=get(m.x+dir[0],m.y+dir[1]);

        if(next){
          next.buf++;
          next.type=m.type;
          m.buf--;
          m.cool=10;
        }
      }
    }
  });
}

// 👇 インゴット描画
function drawIngot(x,y,color){
  ctx.fillStyle=color;
  ctx.fillRect(x+10,y+18,30,14);
  ctx.strokeStyle="#000";
  ctx.strokeRect(x+10,y+18,30,14);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let x=0;x<COLS;x++){
    for(let y=0;y<ROWS;y++){
      ctx.strokeStyle="#333";
      ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);
    }
  }

  resourceNodes.forEach(n=>{
    ctx.fillStyle="#335533";
    ctx.fillRect(n.x*CELL,n.y*CELL,CELL,CELL);
  });

  machines.forEach(m=>{
    const px=m.x*CELL,py=m.y*CELL;

    ctx.fillStyle = m.id==='miner'?"#6a3":"#888";
    ctx.fillRect(px+5,py+5,CELL-10,CELL-10);

    if(m.id==='conveyor'){
      ctx.fillStyle="#fff";
      ctx.fillText("→↓←↑"[m.dir],px+15,py+30);
    }

    // 👇 アイコン表示
    if(m.buf>0){
      const color=RES_TYPES[m.type]?.color || "#fff";
      drawIngot(px,py,color);

      ctx.fillStyle="#fff";
      ctx.fillText(m.buf, px+32, py+16);
    }
  });

  ctx.fillStyle="#fff";
  ctx.fillText("素材:"+G.mat,10,20);
}

function save(){
  localStorage.setItem("factorySave", JSON.stringify({machines,G}));
}

function load(){
  const data=localStorage.getItem("factorySave");
  if(!data) return;
  const parsed=JSON.parse(data);

  parsed.machines.forEach(m=>{
    machines.push(m);
    grid[key(m.x,m.y)]=m;
  });

  G.mat=parsed.G.mat;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

load();
selectTool('miner');
loop();
</script>
</body>
</html>
