<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>

<style>
body{margin:0;background:#1a1a18;color:#eee;font-family:sans-serif}

#ui{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:#111;
  border-bottom:2px solid #333;
}

button{
  padding:8px 10px;
  border-radius:8px;
  border:none;
  background:#333;
  color:#fff;
}

.active{background:#5a5}

#panel{
  position:fixed;
  right:10px;
  top:60px;
  background:#000c;
  padding:12px;
  border-radius:10px;
  font-size:14px;
  border:1px solid #333;
}

canvas{
  display:block;
  margin:auto;
  background:#222;
  touch-action:none;
}

#settings{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:12px;
display:none;
border:1px solid #555;
}

/* ミニマップ */
#mini{
position:fixed;
right:10px;
bottom:10px;
width:150px;
height:100px;
background:#000a;
border:1px solid #555;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">⛏ 採掘</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">➡ コンベア</button>
  <button onclick="selectTool('splitter')" id="btn-splitter">⇄ 分岐</button>
  <button onclick="selectTool('power')" id="btn-power">⚡ 発電</button>
  <button onclick="selectTool('storage')" id="btn-storage">📦 倉庫</button>
  <button onclick="selectTool('delete')" id="btn-delete">🗑 削除</button>
  <button onclick="toggleSettings()">⚙ 設定</button>
</div>

<div id="panel"></div>

<div id="settings">
  <h3>設定</h3>
  <button onclick="saveGame()">💾 保存</button><br><br>
  <button onclick="resetGame()">🗑 データ削除</button><br><br>
  <button onclick="toggleSettings()">閉じる</button>
</div>

<canvas id="c"></canvas>
<canvas id="mini"></canvas>

<script>
let CELL=50;
const COLS=40, ROWS=30;
const MAX_PER_TILE=3;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const mini=document.getElementById('mini');
const mctx=mini.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight-60;

mini.width=150;
mini.height=100;

let camX=0, camY=0;

let selected='miner';

const grid={}, machines=[], items=[];
const RES={iron:0,coal:0};
let power=50;

// ===== 超軽量 無限マップ =====
const resourceNodes={};
const checkedNodes={};

function rkey(x,y){return x+","+y}

function rand(x,y){
  return Math.abs(Math.sin(x*127.1+y*311.7)*43758.5453)%1;
}

// ★5マス塊保証
function generateCluster(x,y,type){
  const cluster=[{x,y}];

  while(cluster.length<5){
    const base=cluster[Math.floor(rand(cluster.length,x)*cluster.length)];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const d=dirs[Math.floor(rand(base.x,base.y)*4)];

    const nx=base.x+d[0];
    const ny=base.y+d[1];

    if(!cluster.find(n=>n.x===nx&&n.y===ny)){
      cluster.push({x:nx,y:ny});
    }
  }

  cluster.forEach(n=>{
    resourceNodes[rkey(n.x,n.y)]={x:n.x,y:n.y,type};
  });
}

function getResource(x,y){
  const k=rkey(x,y);

  if(resourceNodes[k]) return resourceNodes[k];
  if(checkedNodes[k]) return null;

  checkedNodes[k]=true;

  if(rand(x,y) > 0.995){
    const type = rand(x+100,y+100) > 0.5 ? "iron":"coal";
    generateCluster(x,y,type);
  }

  return resourceNodes[k] || null;
}
// =========================

// ===== 設定 =====
function toggleSettings(){
  const el=document.getElementById("settings");
  el.style.display = el.style.display==="none" ? "block" : "none";
}

function saveGame(){
  localStorage.setItem("factorySave",JSON.stringify({
    machines,items,RES,power,camX,camY
  }));
}

function resetGame(){
  localStorage.clear();
  location.reload();
}
// =================

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

// ★重い原因 → filterをやめて軽量化
function countItems(x,y){
  let c=0;
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if((it.x|0)===x && (it.y|0)===y) c++;
  }
  return c;
}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+t)?.classList.add("active");
}

function place(x,y){
  if(get(x,y)) return;

  const node=getResource(x,y);
  if(selected==='miner' && !node) return;

  const m={
    id:selected,x,y,dir:0,cool:0,
    type:node?.type||"iron",
    toggle:0
  };

  machines.push(m);
  grid[key(x,y)]=m;
}

function remove(x,y){
  const m=get(x,y);
  if(!m) return;
  delete grid[key(x,y)];
  machines.splice(machines.indexOf(m),1);
}

function rotate(m){m.dir=(m.dir+1)%4}

function getPos(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:Math.floor((e.clientX-r.left)/CELL + camX),
    y:Math.floor((e.clientY-r.top)/CELL + camY)
  };
}

// ===== ミニマップ軽量化 =====
let miniFrame=0;
function drawMini(){
  miniFrame++;
  if(miniFrame%6!==0) return;

  mctx.clearRect(0,0,mini.width,mini.height);

  const scaleX=mini.width/200;
  const scaleY=mini.height/200;

  for(let i=0;i<machines.length;i+=2){
    const m=machines[i];
    mctx.fillStyle=
      m.id==='miner'?"#6a3":
      m.id==='power'?"#a33":
      m.id==='storage'?"#36a":"#aaa";

    mctx.fillRect(m.x*scaleX,m.y*scaleY,2,2);
  }

  mctx.strokeStyle="#fff";
  mctx.strokeRect(
    camX*scaleX,
    camY*scaleY,
    COLS*scaleX,
    ROWS*scaleY
  );
}

// ===== 描画軽量化（遠距離省略） =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-camX*CELL, -camY*CELL);

  const startX=Math.floor(camX);
  const startY=Math.floor(camY);

  for(let x=startX-1;x<startX+COLS+1;x++){
    for(let y=startY-1;y<startY+ROWS+1;y++){
      ctx.strokeStyle="#333";
      ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);

      const n=getResource(x,y);
      if(n){
        ctx.fillStyle=n.type==="iron"?"#555":"#111";
        ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
      }
    }
  }

  machines.forEach(m=>{
    if(Math.abs(m.x-camX)>COLS || Math.abs(m.y-camY)>ROWS) return;

    const px=m.x*CELL,py=m.y*CELL;
    ctx.fillStyle=
      m.id==='miner'?"#6a3":
      m.id==='power'?"#a33":
      m.id==='storage'?"#36a":
      m.id==='splitter'?"#aa6":"#888";

    ctx.fillRect(px+5,py+5,CELL-10,CELL-10);

    ctx.fillStyle="#fff";
    if(m.id==='miner') ctx.fillText("⛏",px+15,py+30);
    if(m.id==='power') ctx.fillText("⚡",px+15,py+30);
    if(m.id==='storage') ctx.fillText("📦",px+15,py+30);
    if(m.id==='splitter') ctx.fillText("⇄",px+15,py+30);
    if(m.id==='conveyor') ctx.fillText("→↓←↑"[m.dir],px+15,py+30);
  });

  items.forEach(it=>{
    const px=(it.x+it.dx*it.p)*CELL;
    const py=(it.y+it.dy*it.p)*CELL;
    ctx.fillStyle=it.type==="iron"?"#ccc":"#444";
    ctx.fillRect(px-6,py-3,12,6);
  });

  ctx.restore();

  drawMini();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

selectTool('miner');
loop();
</script>

</body>
</html>
