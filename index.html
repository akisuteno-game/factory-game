<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>

<style>
body{margin:0;background:#1a1a18;color:#eee;font-family:sans-serif;overflow:auto}

#ui{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#111;border-bottom:2px solid #333}
button{padding:8px 10px;border-radius:8px;border:none;background:#333;color:#fff}
.active{background:#5a5}

#panel{
position:fixed;right:10px;top:60px;background:#000c;
padding:12px;border-radius:10px;font-size:14px;
border:1px solid #333;
}

#settings{
position:fixed;left:50%;top:50%;
transform:translate(-50%,-50%);
background:#111;padding:20px;border-radius:12px;
display:none;z-index:10;border:1px solid #555;
}

#wrap{
overflow:auto;
width:100vw;
height:calc(100vh - 60px);
}

canvas{
background:#222;
transform-origin:0 0;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">⛏</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">➡</button>
  <button onclick="selectTool('splitter')" id="btn-splitter">⇄</button>
  <button onclick="selectTool('power')" id="btn-power">⚡</button>
  <button onclick="selectTool('storage')" id="btn-storage">📦</button>
  <button onclick="selectTool('delete')" id="btn-delete">🗑</button>
  <button onclick="toggleSettings()">⚙</button>
</div>

<div id="panel"></div>

<div id="settings">
  <h3>設定</h3>
  <button onclick="saveGame()">保存</button><br><br>
  <button onclick="resetGame()">データ削除</button><br><br>
  <button onclick="toggleSettings()">閉じる</button>
</div>

<div id="wrap">
  <canvas id="c"></canvas>
</div>

<script>
const CELL=50, COLS=40, ROWS=30;
let scale=1;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

canvas.width=COLS*CELL;
canvas.height=ROWS*CELL;

let selected='miner';
const grid={}, machines=[], items=[];
const RES={iron:0,coal:0};
let power=50;

// 資源増やした
const resourceNodes=[
  {x:3,y:3,type:"iron"},
  {x:5,y:10,type:"iron"},
  {x:15,y:8,type:"coal"},
  {x:20,y:20,type:"coal"},
  {x:30,y:5,type:"iron"}
];

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+t)?.classList.add("active");
}

// 鉱石チェック追加
function isResource(x,y){
  return resourceNodes.find(n=>n.x===x&&n.y===y);
}

function place(x,y){
  if(get(x,y)) return;

  // ⛏は資源の上だけ
  if(selected==="miner" && !isResource(x,y)) return;

  const node=isResource(x,y);

  const m={
    id:selected,x,y,dir:0,cool:0,
    type:node?.type||"iron",
    toggle:0
  };

  machines.push(m);
  grid[key(x,y)]=m;
}

function remove(x,y){
  const m=get(x,y);
  if(!m) return;
  delete grid[key(x,y)];
  machines.splice(machines.indexOf(m),1);
}

function rotate(m){m.dir=(m.dir+1)%4}

// ===== 操作 =====
let dragging=false;
let lastX=-1,lastY=-1;
let pressTimer;

function handlePos(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:Math.floor((e.clientX-r.left)/CELL/scale),
    y:Math.floor((e.clientY-r.top)/CELL/scale)
  };
}

canvas.addEventListener("pointerdown",e=>{
  const p=handlePos(e);
  dragging=true;

  pressTimer=setTimeout(()=>{
    remove(p.x,p.y);
  },400);

  place(p.x,p.y);
  lastX=p.x; lastY=p.y;
});

canvas.addEventListener("pointermove",e=>{
  if(!dragging) return;

  const p=handlePos(e);
  if(p.x===lastX && p.y===lastY) return;

  place(p.x,p.y);
  lastX=p.x; lastY=p.y;
});

canvas.addEventListener("pointerup",()=>{
  dragging=false;
  clearTimeout(pressTimer);
});

// ズーム
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale=Math.max(0.5,Math.min(2,scale));
  canvas.style.transform=`scale(${scale})`;
});

// ===== ゲーム =====

function spawn(m){
  items.push({x:m.x+0.5,y:m.y+0.5,dx:1,dy:0,p:0,type:m.type});
}

function update(){
  machines.forEach(m=>{
    if(m.cool>0)m.cool--;

    if(m.id==='miner' && m.cool===0){
      spawn(m);
      m.cool=60;
    }

    if(m.id==='storage'){
      items.forEach(it=>{
        if(Math.floor(it.x)===m.x && Math.floor(it.y)===m.y){
          RES[it.type]++;
          it.dead=true;
        }
      });
    }
  });

  items.forEach(it=>{
    it.p+=0.03;
    if(it.p>=1){
      it.x+=it.dx; it.y+=it.dy; it.p=0;
    }
  });

  items.forEach(it=>{
    if(it.dead) items.splice(items.indexOf(it),1);
  });
}

function saveGame(){
  localStorage.setItem("factorySave",JSON.stringify({machines,RES,power}));
}

function loadGame(){
  const data=JSON.parse(localStorage.getItem("factorySave"));
  if(!data)return;

  machines.length=0;
  Object.keys(grid).forEach(k=>delete grid[k]);

  data.machines.forEach(m=>{
    machines.push(m);
    grid[key(m.x,m.y)]=m;
  });

  RES.iron=data.RES.iron;
  RES.coal=data.RES.coal;
}

loadGame();
setInterval(saveGame,5000);

function toggleSettings(){
  const el=document.getElementById("settings");
  el.style.display = el.style.display==="none"?"block":"none";
}

function resetGame(){
  localStorage.removeItem("factorySave");
  location.reload();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  resourceNodes.forEach(n=>{
    ctx.fillStyle=n.type==="iron"?"#666":"#222";
    ctx.fillRect(n.x*CELL,n.y*CELL,CELL,CELL);
  });

  machines.forEach(m=>{
    ctx.fillStyle="#888";
    ctx.fillRect(m.x*CELL+5,m.y*CELL+5,CELL-10,CELL-10);
  });

  items.forEach(it=>{
    ctx.fillStyle="#fff";
    ctx.fillRect(it.x*CELL,it.y*CELL,5,5);
  });

  document.getElementById("panel").innerHTML=
    "鉄:"+RES.iron+" 石炭:"+RES.coal;
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
