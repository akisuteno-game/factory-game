<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>
<style>
body{margin:0;font-family:sans-serif;background:#1a1a18;color:#eee}
#ui{padding:8px;display:flex;gap:8px}
button{padding:10px;border-radius:8px;border:none;background:#333;color:#fff}
canvas{display:block;margin:auto;background:#222;touch-action:none}
.active{background:#5a5}
</style>
</head>
<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">採掘</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">コンベア</button>
  <button onclick="selectTool('delete')" id="btn-delete">削除</button>
</div>

<canvas id="c"></canvas>

<script>
const CELL=50, COLS=12, ROWS=8;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

canvas.width=COLS*CELL;
canvas.height=ROWS*CELL;

let selected='miner';

const grid={};
const machines=[];
const items=[]; // 👈 流れるアイテム

const RES_TYPES={
  iron:{color:"#ccc"},
  copper:{color:"#f84"}
};

const resourceNodes=[
  {x:2,y:3,type:"iron"},
  {x:7,y:5,type:"copper"}
];

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+t)?.classList.add("active");
}

function place(x,y){
  if(get(x,y)) return;
  const node=resourceNodes.find(n=>n.x===x&&n.y===y);

  const m={
    id:selected,
    x,y,
    dir:0,
    cool:0,
    type: node?.type || "iron"
  };

  machines.push(m);
  grid[key(x,y)]=m;
}

function remove(x,y){
  const k=key(x,y);
  const m=grid[k];
  if(!m) return;
  delete grid[k];
  const i=machines.indexOf(m);
  if(i!==-1) machines.splice(i,1);
}

function rotate(m){m.dir=(m.dir+1)%4}

function handleInput(e){
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL);
  const y=Math.floor((e.clientY-r.top)/CELL);
  const m=get(x,y);

  if(selected==='delete'){
    remove(x,y);
    return;
  }

  if(m && m.id==='conveyor'){
    rotate(m);
  }else{
    place(x,y);
  }
}

canvas.addEventListener("click", handleInput);
canvas.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  handleInput(e.touches[0]);
});

// 👇 アイテム生成（採掘機）
function spawnItem(m){
  const dir=[[1,0],[0,1],[-1,0],[0,-1]][m.dir];
  items.push({
    x:m.x+0.5,
    y:m.y+0.5,
    dx:dir[0],
    dy:dir[1],
    progress:0,
    type:m.type
  });
}

function update(){
  machines.forEach(m=>{
    if(m.cool>0) m.cool--;

    if(m.id==='miner' && m.cool===0){
      if(Math.random()<0.02){
        spawnItem(m);
        m.cool=30;
      }
    }
  });

  // 👇 アイテム移動
  items.forEach(it=>{
    it.progress += 0.05;

    if(it.progress >= 1){
      it.x += it.dx;
      it.y += it.dy;
      it.progress = 0;

      const tile = get(Math.floor(it.x), Math.floor(it.y));
      if(tile && tile.id==='conveyor'){
        const dir=[[1,0],[0,1],[-1,0],[0,-1]][tile.dir];
        it.dx=dir[0];
        it.dy=dir[1];
      }else{
        it.dead=true;
      }
    }
  });

  // 消えるやつ削除
  for(let i=items.length-1;i>=0;i--){
    if(items[i].dead) items.splice(i,1);
  }
}

function drawIngot(x,y,color){
  ctx.fillStyle=color;
  ctx.fillRect(x-8,y-4,16,8);
  ctx.strokeStyle="#000";
  ctx.strokeRect(x-8,y-4,16,8);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let x=0;x<COLS;x++){
    for(let y=0;y<ROWS;y++){
      ctx.strokeStyle="#333";
      ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);
    }
  }

  resourceNodes.forEach(n=>{
    ctx.fillStyle="#335533";
    ctx.fillRect(n.x*CELL,n.y*CELL,CELL,CELL);
  });

  machines.forEach(m=>{
    const px=m.x*CELL,py=m.y*CELL;

    ctx.fillStyle = m.id==='miner'?"#6a3":"#888";
    ctx.fillRect(px+5,py+5,CELL-10,CELL-10);

    if(m.id==='conveyor'){
      ctx.fillStyle="#fff";
      ctx.fillText("→↓←↑"[m.dir],px+15,py+30);
    }
  });

  // 👇 流れるアイテム描画
  items.forEach(it=>{
    const px = (it.x + it.dx*it.progress)*CELL;
    const py = (it.y + it.dy*it.progress)*CELL;
    const color=RES_TYPES[it.type]?.color || "#fff";
    drawIngot(px,py,color);
  });
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

selectTool('miner');
loop();
</script>
</body>
</html>
