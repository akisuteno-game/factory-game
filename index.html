<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>

<style>
body{margin:0;background:#1a1a18;color:#eee;font-family:sans-serif}

#ui{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#111}
button{padding:8px;border:none;border-radius:8px;background:#333;color:#fff}
.active{background:#5a5}

#wrap{
width:100vw;
height:calc(100vh - 60px);
overflow:auto;
}

canvas{
background:#222;
transform-origin:0 0;
}

#panel{
position:fixed;
right:10px;
top:60px;
background:#000c;
padding:10px;
border-radius:10px;
}

#settings{
position:fixed;
left:50%;top:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
display:none;
border-radius:10px;
}
</style>
</head>

<body>

<div id="ui">
<button onclick="selectTool('miner')" id="btn-miner">⛏</button>
<button onclick="selectTool('conveyor')" id="btn-conveyor">➡</button>
<button onclick="selectTool('storage')" id="btn-storage">📦</button>
<button onclick="selectTool('delete')" id="btn-delete">🗑</button>
<button onclick="toggleSettings()">⚙</button>
</div>

<div id="panel"></div>

<div id="settings">
<h3>設定</h3>
<button onclick="saveGame()">保存</button><br><br>
<button onclick="resetGame()">削除</button><br><br>
<button onclick="toggleSettings()">閉じる</button>
</div>

<div id="wrap">
<canvas id="c"></canvas>
</div>

<script>
const CELL=50, COLS=40, ROWS=25;
let scale=1;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

canvas.width=COLS*CELL;
canvas.height=ROWS*CELL;

let selected='miner';

const grid={}, machines=[], items=[];
const RES={iron:0,coal:0};

// 資源
const resourceNodes=[
{x:3,y:3,type:"iron"},
{x:10,y:5,type:"iron"},
{x:20,y:10,type:"coal"},
{x:30,y:15,type:"coal"}
];

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function isResource(x,y){
return resourceNodes.find(n=>n.x===x&&n.y===y);
}

function selectTool(t){
selected=t;
document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
document.getElementById("btn-"+t)?.classList.add("active");
}

function place(x,y){
if(get(x,y)) return;
if(selected==="miner" && !isResource(x,y)) return;

const node=isResource(x,y);

const m={
id:selected,x,y,dir:0,type:node?.type||"iron"
};

machines.push(m);
grid[key(x,y)]=m;
}

function remove(x,y){
const m=get(x,y);
if(!m)return;
delete grid[key(x,y)];
machines.splice(machines.indexOf(m),1);
}

// ===== 操作 =====
let dragging=false;
let lastX=-1,lastY=-1;
let pressTimer;

function pos(e){
const r=canvas.getBoundingClientRect();
return {
x:Math.floor((e.clientX-r.left)/CELL/scale),
y:Math.floor((e.clientY-r.top)/CELL/scale)
};
}

canvas.addEventListener("pointerdown",e=>{
const p=pos(e);
dragging=true;

pressTimer=setTimeout(()=>{
remove(p.x,p.y);
},400);

place(p.x,p.y);
lastX=p.x; lastY=p.y;
});

canvas.addEventListener("pointermove",e=>{
if(!dragging)return;
const p=pos(e);
if(p.x===lastX && p.y===lastY)return;
place(p.x,p.y);
lastX=p.x; lastY=p.y;
});

canvas.addEventListener("pointerup",()=>{
dragging=false;
clearTimeout(pressTimer);
});

// ズーム
canvas.addEventListener("wheel",e=>{
e.preventDefault();
scale+=e.deltaY*-0.001;
scale=Math.max(0.5,Math.min(2,scale));
canvas.style.transform=`scale(${scale})`;
});

// ===== ゲーム =====

function spawn(m){
items.push({x:m.x+0.5,y:m.y+0.5,dx:1,dy:0,p:0,type:m.type});
}

function update(){
machines.forEach(m=>{
if(m.id==='miner' && Math.random()<0.02){
spawn(m);
}

if(m.id==='storage'){
items.forEach(it=>{
if(Math.floor(it.x)===m.x && Math.floor(it.y)===m.y){
RES[it.type]++;
it.dead=true;
}
});
}
});

items.forEach(it=>{
it.p+=0.05;
if(it.p>=1){
it.x+=it.dx;
it.p=0;
}
});

items=items.filter(it=>!it.dead);
}

function saveGame(){
localStorage.setItem("factorySave",JSON.stringify({machines,RES}));
}

function loadGame(){
const data=JSON.parse(localStorage.getItem("factorySave"));
if(!data)return;

machines.length=0;
Object.keys(grid).forEach(k=>delete grid[k]);

data.machines.forEach(m=>{
machines.push(m);
grid[key(m.x,m.y)]=m;
});

RES.iron=data.RES.iron;
RES.coal=data.RES.coal;
}

loadGame();
setInterval(saveGame,5000);

function toggleSettings(){
const el=document.getElementById("settings");
el.style.display = el.style.display==="none"?"block":"none";
}

function resetGame(){
localStorage.removeItem("factorySave");
location.reload();
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

resourceNodes.forEach(n=>{
ctx.fillStyle=n.type==="iron"?"#555":"#222";
ctx.fillRect(n.x*CELL,n.y*CELL,CELL,CELL);
});

machines.forEach(m=>{
ctx.fillStyle="#888";
ctx.fillRect(m.x*CELL+5,m.y*CELL+5,CELL-10,CELL-10);
});

items.forEach(it=>{
ctx.fillStyle="#fff";
ctx.fillRect(it.x*CELL,it.y*CELL,5,5);
});

document.getElementById("panel").innerHTML=
"鉄:"+RES.iron+" 石炭:"+RES.coal;
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
