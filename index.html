<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+ Ultra Lite</title>

<style>
body{margin:0;background:#1a1a18;color:#eee;font-family:sans-serif}
#ui{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#111;border-bottom:2px solid #333}
button{padding:8px 10px;border-radius:8px;border:none;background:#333;color:#fff}
.active{background:#5a5}
#panel{position:fixed;right:10px;top:60px;background:#000c;padding:12px;border-radius:10px;font-size:14px;border:1px solid #333}
canvas{display:block;margin:auto;background:#222;touch-action:none}
#settings{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111;padding:20px;border-radius:12px;display:none;border:1px solid #555}
#mini{position:fixed;right:10px;bottom:10px;width:150px;height:100px;background:#000a;border:1px solid #555}
</style>
</head>

<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">⛏</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">➡</button>
  <button onclick="selectTool('splitter')" id="btn-splitter">⇄</button>
  <button onclick="selectTool('power')" id="btn-power">⚡</button>
  <button onclick="selectTool('storage')" id="btn-storage">📦</button>
  <button onclick="selectTool('delete')" id="btn-delete">🗑</button>
</div>

<div id="panel"></div>

<canvas id="c"></canvas>
<canvas id="mini"></canvas>

<script>
let CELL=50;
const COLS=40, ROWS=30;
const MAX_PER_TILE=3;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const mini=document.getElementById('mini');
const mctx=mini.getContext('2d');

canvas.width=innerWidth;
canvas.height=innerHeight-60;

ctx.font="16px sans-serif";

let camX=0, camY=0;
let selected='miner';

const grid={}, machines=[], items=[];
const RES={iron:0,coal:0};
let power=50;

// ===== キャッシュ制限 =====
const resourceNodes={};
const checkedNodes={};
const MAX_CACHE=5000;

function cleanupCache(){
  const keys=Object.keys(checkedNodes);
  if(keys.length>MAX_CACHE){
    for(let i=0;i<1000;i++){
      delete checkedNodes[keys[i]];
    }
  }
}

function rkey(x,y){return x+","+y}

function rand(x,y){
  return Math.abs(Math.sin(x*127.1+y*311.7)*43758.5453)%1;
}

function generateCluster(x,y,type){
  const cluster=[{x,y}];
  while(cluster.length<5){
    const base=cluster[Math.floor(Math.random()*cluster.length)];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const d=dirs[Math.floor(Math.random()*4)];
    const nx=base.x+d[0], ny=base.y+d[1];
    if(!cluster.find(n=>n.x===nx&&n.y===ny)){
      cluster.push({x:nx,y:ny});
    }
  }
  cluster.forEach(n=>{
    resourceNodes[rkey(n.x,n.y)]={x:n.x,y:n.y,type};
  });
}

function getResource(x,y){
  const k=rkey(x,y);
  if(resourceNodes[k]) return resourceNodes[k];
  if(checkedNodes[k]) return null;

  checkedNodes[k]=true;

  if(rand(x,y)>0.995){
    const type=rand(x+100,y+100)>0.5?"iron":"coal";
    generateCluster(x,y,type);
  }

  cleanupCache();
  return resourceNodes[k]||null;
}

// ===== 軽量 countItems =====
function countItems(x,y){
  let c=0;
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if((it.x|0)===x && (it.y|0)===y) c++;
  }
  return c;
}

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  const el=document.getElementById("btn-"+t);
  if(el) el.classList.add("active");
}

function place(x,y){
  if(get(x,y)) return;
  const node=getResource(x,y);
  if(selected==='miner' && !node) return;

  const m={id:selected,x,y,dir:0,cool:0,type:node?node.type:"iron",toggle:0};
  machines.push(m);
  grid[key(x,y)]=m;
}

// ===== 描画最適化 =====
let uiFrame=0;
let miniFrame=0;

function drawUI(){
  uiFrame++;
  if(uiFrame%10!==0) return;
  document.getElementById("panel").innerHTML=
    "鉄:"+RES.iron+" 石炭:"+RES.coal+" ⚡"+power;
}

function drawMini(){
  miniFrame++;
  if(miniFrame%10!==0) return;

  mctx.clearRect(0,0,mini.width,mini.height);

  for(let i=0;i<machines.length;i+=3){
    const m=machines[i];
    mctx.fillRect(m.x*0.5,m.y*0.5,2,2);
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(-camX*CELL, -camY*CELL);

  const startX=camX|0;
  const startY=camY|0;

  for(let x=startX-1;x<startX+COLS;x++){
    for(let y=startY-1;y<startY+ROWS;y++){
      ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);

      const n=getResource(x,y);
      if(n){
        ctx.fillStyle=n.type==="iron"?"#555":"#111";
        ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
      }
    }
  }

  // 近くのだけ描画
  for(let i=0;i<machines.length;i++){
    const m=machines[i];
    if(Math.abs(m.x-camX)>COLS) continue;
    if(Math.abs(m.y-camY)>ROWS) continue;

    ctx.fillStyle="#6a3";
    ctx.fillRect(m.x*CELL+5,m.y*CELL+5,CELL-10,CELL-10);
  }

  ctx.restore();

  drawUI();
  drawMini();
}

function loop(){
  draw();
  requestAnimationFrame(loop);
}

selectTool('miner');
loop();
</script>

</body>
</html>
