<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>

<style>
body{margin:0;background:#1a1a18;color:#eee;font-family:sans-serif}

#ui{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:#111;
  border-bottom:2px solid #333;
}

button{
  padding:8px 10px;
  border-radius:8px;
  border:none;
  background:#333;
  color:#fff;
}

.active{background:#5a5}

#panel{
  position:fixed;
  right:10px;
  top:60px;
  background:#000c;
  padding:12px;
  border-radius:10px;
  font-size:14px;
  line-height:1.6;
  min-width:120px;
  border:1px solid #333;
}

canvas{
  display:block;
  margin:auto;
  background:#222;
}

#settings{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:12px;
display:none;
z-index:10;
border:1px solid #555;
min-width:200px;
text-align:center;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">⛏ 採掘</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">➡ コンベア</button>
  <button onclick="selectTool('splitter')" id="btn-splitter">⇄ 分岐</button>
  <button onclick="selectTool('power')" id="btn-power">⚡ 発電</button>
  <button onclick="selectTool('storage')" id="btn-storage">📦 倉庫</button>
  <button onclick="selectTool('delete')" id="btn-delete">🗑 削除</button>

  <button onclick="toggleSettings()">⚙ 設定</button>
</div>

<div id="panel"></div>

<div id="settings">
  <h3>設定</h3>
  <button onclick="saveGame()">💾 保存</button><br><br>
  <button onclick="resetGame()">🗑 データ削除</button><br><br>
  <button onclick="toggleSettings()">閉じる</button>
</div>

<canvas id="c"></canvas>

<script>
const CELL=50, COLS=16, ROWS=10;
const MAX_PER_TILE=3;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

canvas.width=COLS*CELL;
canvas.height=ROWS*CELL;

let selected='miner';

const grid={}, machines=[], items=[];
const RES={iron:0,coal:0};
let power=50;

const resourceNodes=[
  {x:3,y:3,type:"iron"},
  {x:10,y:6,type:"coal"}
];

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function countItems(x,y){
  return items.filter(it=>Math.floor(it.x)===x && Math.floor(it.y)===y).length;
}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+t)?.classList.add("active");
}

function place(x,y){
  if(get(x,y)) return;

  const node=resourceNodes.find(n=>n.x===x&&n.y===y);

  const m={
    id:selected,x,y,dir:0,cool:0,
    type:node?.type||"iron",
    toggle:0
  };

  machines.push(m);
  grid[key(x,y)]=m;
}

function remove(x,y){
  const m=get(x,y);
  if(!m) return;
  delete grid[key(x,y)];
  machines.splice(machines.indexOf(m),1);
}

function rotate(m){m.dir=(m.dir+1)%4}

function handleInput(e){
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL);
  const y=Math.floor((e.clientY-r.top)/CELL);
  const m=get(x,y);

  if(selected==='delete'){ remove(x,y); return; }
  if(m && (m.id==='conveyor'||m.id==='splitter')) rotate(m);
  else place(x,y);
}

/* ===== ここから追加（タッチ改善） ===== */

let touchMoved = false;

canvas.addEventListener("touchstart",(e)=>{
  if(e.touches.length > 1) return; // 2本指は無視
  touchMoved = false;
});

canvas.addEventListener("touchmove",()=>{
  touchMoved = true;
});

canvas.addEventListener("touchend",(e)=>{
  if(touchMoved) return; // スクロールなら無視
  const touch = e.changedTouches[0];
  handleInput(touch);
});

/* ===== ここまで追加 ===== */

canvas.addEventListener("click", handleInput);

function spawn(m){
  if(countItems(m.x,m.y)>=MAX_PER_TILE) return;

  const d=[[1,0],[0,1],[-1,0],[0,-1]][m.dir];

  items.push({
    x:m.x+0.5,
    y:m.y+0.5,
    dx:d[0],
    dy:d[1],
    p:0,
    type:m.type
  });
}

function nextTile(it){
  return get(Math.floor(it.x+it.dx),Math.floor(it.y+it.dy));
}

function update(){
  machines.forEach(m=>{
    if(m.cool>0) m.cool--;

    if(m.id==='miner' && power>0 && m.cool===0){
      spawn(m);
      m.cool=40;
      power--;
    }

    if(m.id==='power'){
      items.forEach(it=>{
        if(Math.floor(it.x)===m.x && Math.floor(it.y)===m.y){
          if(it.type==='coal'){
            power+=10;
            it.dead=true;
          }
        }
      });
    }

    if(m.id==='storage'){
      items.forEach(it=>{
        if(Math.floor(it.x)===m.x && Math.floor(it.y)===m.y){
          RES[it.type]++;
          it.dead=true;
        }
      });
    }
  });

  items.forEach(it=>{
    it.p+=0.05;

    if(it.p>=1){
      const next=nextTile(it);

      if(!next){
        it.p=0.99;
        return;
      }

      const nx=Math.floor(it.x+it.dx);
      const ny=Math.floor(it.y+it.dy);

      if(countItems(nx,ny)>=MAX_PER_TILE){
        it.p=0.99;
        return;
      }

      it.x+=it.dx;
      it.y+=it.dy;
      it.p=0;

      if(next.id==='conveyor'){
        const d=[[1,0],[0,1],[-1,0],[0,-1]][next.dir];
        it.dx=d[0];
        it.dy=d[1];
      }

      if(next.id==='splitter'){
        const dirs=[[1,0],[0,1],[-1,0],[0,-1]];
        const side=next.toggle?1:-1;
        next.toggle=1-next.toggle;
        const d=dirs[(next.dir+side+4)%4];
        it.dx=d[0];
        it.dy=d[1];
      }
    }
  });

  for(let i=items.length-1;i>=0;i--){
    if(items[i].dead) items.splice(i,1);
  }
}

function saveGame(){
  if(machines.length===0) return;
  localStorage.setItem("factorySave",JSON.stringify({machines,RES,power}));
}

function loadGame(){
  const data=JSON.parse(localStorage.getItem("factorySave"));
  if(!data) return;

  machines.length=0;
  Object.keys(grid).forEach(k=>delete grid[k]);

  data.machines.forEach(m=>{
    machines.push(m);
    grid[key(m.x,m.y)]=m;
  });

  RES.iron=data.RES.iron;
  RES.coal=data.RES.coal;
  power=data.power;
}

loadGame();
setInterval(saveGame,5000);

function toggleSettings(){
  const el=document.getElementById("settings");
  el.style.display = (el.style.display==="none") ? "block" : "none";
}

function resetGame(){
  if(!confirm("データ消す？")) return;
  localStorage.removeItem("factorySave");
  location.reload();
}

function drawUI(){
  document.getElementById("panel").innerHTML=
    "<b>資源</b><br>"+
    "🪨 鉄: "+RES.iron+"<br>"+
    "⚫ 石炭: "+RES.coal+"<br><br>"+
    "<b>電力</b><br>"+
    "⚡ "+power;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let x=0;x<COLS;x++){
    for(let y=0;y<ROWS;y++){
      ctx.strokeStyle="#333";
      ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);
    }
  }

  resourceNodes.forEach(n=>{
    ctx.fillStyle=n.type==="iron"?"#555":"#111";
    ctx.fillRect(n.x*CELL,n.y*CELL,CELL,CELL);
  });

  machines.forEach(m=>{
    const px=m.x*CELL,py=m.y*CELL;

    ctx.fillStyle=
      m.id==='miner'?"#6a3":
      m.id==='power'?"#a33":
      m.id==='storage'?"#36a":
      m.id==='splitter'?"#aa6":"#888";

    ctx.fillRect(px+5,py+5,CELL-10,CELL-10);

    ctx.fillStyle="#fff";

    if(m.id==='miner') ctx.fillText("⛏",px+15,py+30);
    if(m.id==='power') ctx.fillText("⚡",px+15,py+30);
    if(m.id==='storage') ctx.fillText("📦",px+15,py+30);
    if(m.id==='splitter') ctx.fillText("⇄",px+15,py+30);
    if(m.id==='conveyor') ctx.fillText("→↓←↑"[m.dir],px+15,py+30);
  });

  items.forEach(it=>{
    const px=(it.x+it.dx*it.p)*CELL;
    const py=(it.y+it.dy*it.p)*CELL;
    ctx.fillStyle=it.type==="iron"?"#ccc":"#444";
    ctx.fillRect(px-6,py-3,12,6);
  });

  drawUI();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

selectTool('miner');
loop();
</script>

</body>
</html>
