<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>

<style>
body{margin:0;background:#1a1a18;color:#eee;font-family:sans-serif}

#ui{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:#111;
  border-bottom:2px solid #333;
}

button{
  padding:8px 10px;
  border-radius:8px;
  border:none;
  background:#333;
  color:#fff;
}

.active{background:#5a5}

#panel{
  position:fixed;
  right:10px;
  top:60px;
  background:#000c;
  padding:12px;
  border-radius:10px;
  font-size:14px;
  border:1px solid #333;
}

canvas{
  display:block;
  margin:auto;
  background:#222;
  touch-action:none;
}

#settings{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:12px;
display:none;
border:1px solid #555;
}

/* ミニマップ */
#mini{
position:fixed;
right:10px;
bottom:10px;
width:150px;
height:100px;
background:#000a;
border:1px solid #555;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">⛏ 採掘</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">➡ コンベア</button>
  <button onclick="selectTool('splitter')" id="btn-splitter">⇄ 分岐</button>
  <button onclick="selectTool('power')" id="btn-power">⚡ 発電</button>
  <button onclick="selectTool('storage')" id="btn-storage">📦 倉庫</button>
  <button onclick="selectTool('delete')" id="btn-delete">🗑 削除</button>
  <button onclick="toggleSettings()">⚙ 設定</button>
</div>

<div id="panel"></div>

<div id="settings">
  <h3>設定</h3>
  <button onclick="saveGame()">💾 保存</button><br><br>
  <button onclick="resetGame()">🗑 データ削除</button><br><br>
  <button onclick="toggleSettings()">閉じる</button>
</div>

<canvas id="c"></canvas>
<canvas id="mini"></canvas>

<script>
let CELL=50;
const COLS=40, ROWS=30;
const MAX_PER_TILE=3;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const mini=document.getElementById('mini');
const mctx=mini.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight-60;

mini.width=150;
mini.height=100;

ctx.font="16px sans-serif"; // ←追加（描画安定）

let camX=0, camY=0;

let selected='miner';

const grid={}, machines=[], items=[];
const RES={iron:0,coal:0};
let power=50;

// ===== 超軽量 無限マップ =====
const resourceNodes={};
const checkedNodes={};

function rkey(x,y){return x+","+y}

function rand(x,y){
  return Math.abs(Math.sin(x*127.1+y*311.7)*43758.5453)%1;
}

// ★5マス塊保証
function generateCluster(x,y,type){
  const cluster=[{x,y}];

  while(cluster.length<5){
    const base=cluster[Math.floor(rand(cluster.length,x)*cluster.length)];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const d=dirs[Math.floor(rand(base.x,base.y)*4)];

    const nx=base.x+d[0];
    const ny=base.y+d[1];

    if(!cluster.find(n=>n.x===nx&&n.y===ny)){
      cluster.push({x:nx,y:ny});
    }
  }

  cluster.forEach(n=>{
    resourceNodes[rkey(n.x,n.y)]={x:n.x,y:n.y,type};
  });
}

function getResource(x,y){
  const k=rkey(x,y);

  if(resourceNodes[k]) return resourceNodes[k];
  if(checkedNodes[k]) return null;

  checkedNodes[k]=true;

  if(rand(x,y) > 0.995){
    const type = rand(x+100,y+100) > 0.5 ? "iron":"coal";
    generateCluster(x,y,type);
  }

  return resourceNodes[k] || null;
}
// =========================

// ===== 設定 =====
function toggleSettings(){
  const el=document.getElementById("settings");
  el.style.display = el.style.display==="none" ? "block" : "none";
}

function saveGame(){
  localStorage.setItem("factorySave",JSON.stringify({
    machines,items,RES,power,camX,camY
  }));
}

function resetGame(){
  localStorage.clear();
  location.reload();
}
// =================

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function countItems(x,y){
  return items.filter(it=>Math.floor(it.x)===x && Math.floor(it.y)===y).length;
}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  const el=document.getElementById("btn-"+t);
  if(el) el.classList.add("active"); // ←ここ修正（?.削除）
}

function place(x,y){
  if(get(x,y)) return;

  const node=getResource(x,y);
  if(selected==='miner' && !node) return;

  const m={
    id:selected,x,y,dir:0,cool:0,
    type:node?.type||"iron",
    toggle:0
  };

  machines.push(m);
  grid[key(x,y)]=m;
}

function remove(x,y){
  const m=get(x,y);
  if(!m) return;
  delete grid[key(x,y)];
  machines.splice(machines.indexOf(m),1);
}

function rotate(m){m.dir=(m.dir+1)%4}

function getPos(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:Math.floor((e.clientX-r.left)/CELL + camX),
    y:Math.floor((e.clientY-r.top)/CELL + camY)
  };
}

// ===== ミニマップクリック移動 =====
mini.addEventListener("click",e=>{
  const rect=mini.getBoundingClientRect();
  const mx=(e.clientX-rect.left)/rect.width;
  const my=(e.clientY-rect.top)/rect.height;

  camX = mx * 200 - COLS/2;
  camY = my * 200 - ROWS/2;
});

// ===== ゲーム本体 =====
function spawn(m){
  if(countItems(m.x,m.y)>=MAX_PER_TILE) return;
  const d=[[1,0],[0,1],[-1,0],[0,-1]][m.dir];
  items.push({x:m.x+0.5,y:m.y+0.5,dx:d[0],dy:d[1],p:0,type:m.type});
}

function nextTile(it){
  return get(Math.floor(it.x+it.dx),Math.floor(it.y+it.dy));
}

function update(){
  machines.forEach(m=>{
    if(m.cool>0) m.cool--;
    if(m.id==='miner' && power>0 && m.cool===0){
      spawn(m); m.cool=40; power--;
    }
  });

  items.forEach(it=>{
    it.p+=0.05;
    if(it.p>=1){
      it.x+=it.dx;
      it.y+=it.dy;
      it.p=0;
    }
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-camX*CELL, -camY*CELL);

  for(let x=0;x<20;x++){
    for(let y=0;y<15;y++){
      ctx.strokeStyle="#333";
      ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);
    }
  }

  machines.forEach(m=>{
    ctx.fillStyle="#6a3";
    ctx.fillRect(m.x*CELL+5,m.y*CELL+5,CELL-10,CELL-10);
  });

  items.forEach(it=>{
    ctx.fillStyle="#ccc";
    ctx.fillRect(it.x*CELL-5,it.y*CELL-3,10,6);
  });

  ctx.restore();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

selectTool('miner');
loop();
</script>

</body>
</html>
