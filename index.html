<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lite+</title>
<style>
body{margin:0;font-family:sans-serif;background:#1a1a18;color:#eee}
#ui{padding:8px;display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px;border-radius:8px;border:none;background:#333;color:#fff}
canvas{display:block;margin:auto;background:#222;touch-action:none}
.active{background:#5a5}
</style>
</head>
<body>

<div id="ui">
  <button onclick="selectTool('miner')" id="btn-miner">採掘</button>
  <button onclick="selectTool('conveyor')" id="btn-conveyor">コンベア</button>
  <button onclick="selectTool('power')" id="btn-power">発電</button>
  <button onclick="selectTool('storage')" id="btn-storage">倉庫</button>
  <button onclick="selectTool('delete')" id="btn-delete">削除</button>
</div>

<canvas id="c"></canvas>

<script>
const CELL=50, COLS=16, ROWS=10;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

canvas.width=COLS*CELL;
canvas.height=ROWS*CELL;

let selected='miner';

const grid={};
const machines=[];
const items=[];

const RES={iron:0,coal:0};
let power=20; // 👈 初期電力つけた

const resourceNodes=[
  {x:3,y:3,type:"iron"},
  {x:10,y:6,type:"coal"}
];

function key(x,y){return x+","+y}
function get(x,y){return grid[key(x,y)]}

function selectTool(t){
  selected=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+t)?.classList.add("active");
}

function place(x,y){
  if(get(x,y)) return;
  const node=resourceNodes.find(n=>n.x===x&&n.y===y);

  const m={
    id:selected,x,y,dir:0,cool:0,
    type:node?.type||"iron",
    fuel:0
  };

  machines.push(m);
  grid[key(x,y)]=m;
}

function remove(x,y){
  const m=get(x,y);
  if(!m) return;
  delete grid[key(x,y)];
  machines.splice(machines.indexOf(m),1);
}

function rotate(m){m.dir=(m.dir+1)%4}

function handleInput(e){
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL);
  const y=Math.floor((e.clientY-r.top)/CELL);
  const m=get(x,y);

  if(selected==='delete'){ remove(x,y); return; }
  if(m && m.id==='conveyor'){ rotate(m); }
  else{ place(x,y); }
}

canvas.addEventListener("click", handleInput);
canvas.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  handleInput(e.touches[0]);
});

function spawn(m){
  const d=[[1,0],[0,1],[-1,0],[0,-1]][m.dir];
  items.push({x:m.x+0.5,y:m.y+0.5,dx:d[0],dy:d[1],p:0,type:m.type});
}

function update(){
  machines.forEach(m=>{
    if(m.cool>0) m.cool--;

    // 採掘（電力必要）
    if(m.id==='miner' && power>0 && m.cool===0){
      spawn(m);
      m.cool=40;
      power--;
    }

    // 発電
    if(m.id==='power'){
      items.forEach(it=>{
        if(Math.floor(it.x)===m.x && Math.floor(it.y)===m.y){
          if(it.type==='coal'){
            m.fuel++;
            it.dead=true;
          }
        }
      });

      if(m.fuel>0 && m.cool===0){
        m.fuel--;
        power+=5;
        m.cool=60;
      }
    }

    // 倉庫
    if(m.id==='storage'){
      items.forEach(it=>{
        if(Math.floor(it.x)===m.x && Math.floor(it.y)===m.y){
          RES[it.type]++;
          it.dead=true;
        }
      });
    }
  });

  items.forEach(it=>{
    it.p+=0.05;
    if(it.p>=1){
      it.x+=it.dx; it.y+=it.dy; it.p=0;
      const t=get(Math.floor(it.x),Math.floor(it.y));
      if(t && t.id==='conveyor'){
        const d=[[1,0],[0,1],[-1,0],[0,-1]][t.dir];
        it.dx=d[0]; it.dy=d[1];
      }else if(!t){ it.dead=true; }
    }
  });

  for(let i=items.length-1;i>=0;i--){
    if(items[i].dead) items.splice(i,1);
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let x=0;x<COLS;x++){
    for(let y=0;y<ROWS;y++){
      ctx.strokeStyle="#333";
      ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);
    }
  }

  resourceNodes.forEach(n=>{
    ctx.fillStyle=n.type==="iron"?"#555":"#111";
    ctx.fillRect(n.x*CELL,n.y*CELL,CELL,CELL);
    ctx.fillStyle="#fff";
    ctx.fillText(n.type==="iron"?"鉄":"石炭",n.x*CELL+5,n.y*CELL+20);
  });

  machines.forEach(m=>{
    const px=m.x*CELL,py=m.y*CELL;

    ctx.fillStyle=
      m.id==='miner'?"#6a3":
      m.id==='power'?"#a33":
      m.id==='storage'?"#36a":"#888";

    ctx.fillRect(px+5,py+5,CELL-10,CELL-10);

    if(m.id==='conveyor'){
      ctx.fillStyle="#fff";
      ctx.fillText("→↓←↑"[m.dir],px+15,py+30);
    }

    if(m.id==='power'){
      ctx.fillText("⚡"+m.fuel,px+5,py+20);
    }
  });

  items.forEach(it=>{
    const px=(it.x+it.dx*it.p)*CELL;
    const py=(it.y+it.dy*it.p)*CELL;
    ctx.fillStyle=it.type==="iron"?"#ccc":"#444";
    ctx.fillRect(px-6,py-3,12,6);
  });

  ctx.fillStyle="#fff";
  ctx.fillText("鉄:"+RES.iron+" 石炭:"+RES.coal+" ⚡"+power,10,20);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

selectTool('miner');
loop();
</script>
</body>
</html>
